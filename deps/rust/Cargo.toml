[package]
name = "colmat-faer"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustcall_julia_macros = "0.5"
num-complex = "0.4"
faer = { package = "t4a-faer", path = "../t4a-faer/faer", default-features = false, features = ["std", "linalg"] }
