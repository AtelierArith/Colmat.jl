[package]
name = "colmat-faer"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustcall_julia_macros = "0.7"
rand = "0.9.2"
rand_distr = "0.5.1"
threadteam = { version = "0.4.0", default-features = false, features = ["parallel"] }
npyz = { version = "0.8.4", default-features = false }
num-complex = "0.4"
faer = { package = "t4a-faer", path = "../t4a-faer/faer", default-features = false, features = ["std", "linalg", "rayon", "rand", "npy", "threadteam"] }
