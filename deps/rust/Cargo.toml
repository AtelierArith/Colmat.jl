[package]
name = "colmat-blas"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
colmat = { path = "../t4a-faer/faer", default-features = false, features = ["std", "rayon", "threadteam"] }
threadteam = { version = "0.6.0", default-features = false, features = ["parallel"] }
paste = "1.0"
