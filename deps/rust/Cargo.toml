[package]
name = "colmat-blas"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
profile-general-evd = []

[dependencies]
colmat = { path = "../colmat-rs/faer", default-features = false, features = ["std", "rayon", "threadteam"] }
threadteam = { version = "0.6.0", default-features = false, features = ["parallel"] }
paste = "1.0"
num-complex = { version = "0.4.6", default-features = false }
