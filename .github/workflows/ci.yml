name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Build
        run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.build("Colmat")'
      - name: Rust formatting and tests
        run: |
          cargo fmt --manifest-path deps/rust/Cargo.toml --check
          cargo test --manifest-path deps/rust/Cargo.toml --locked
      - name: Inventory classification regressions
        run: python3 -m unittest discover -s docs/tests -v
      - name: Julia tests
        run: julia --project -e 'using Pkg; Pkg.test()'
      - name: Save actual ABI execution evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: abi-execution-${{ matrix.os }}
          path: test-output/abi-execution.toml
          if-no-files-found: error
      - name: README example
        run: julia --project examples/poc.jl
